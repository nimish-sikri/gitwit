version: "3.9"

services:
  backend:
    build:
      context: ./backend
      target: development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./data:/app/data

  frontend:
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules

  celery_worker:
    command: celery -A app.workers.tasks worker --loglevel=debug --concurrency=1
    volumes:
      - ./backend:/app
      - ./data:/app/data
